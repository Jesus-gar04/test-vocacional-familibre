<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Test Vocacional Universidad Libre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'libre-red': '#DC2626',
                        'libre-black': '#1F2937',
                        'familibre-light': '#87CEEB',
                        'familibre-dark': '#1E3A8A'
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-inter bg-gradient-to-br from-blue-50 to-red-50 min-h-screen">

    <!-- FORMULARIO DE REGISTRO -->
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-libre-red rounded-full flex items-center justify-center mx-auto mb-4 floating">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-libre-black mb-2">Universidad Libre</h1>
                <p class="text-familibre-dark font-semibold">Programa Familibre</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="flex items-center text-gray-700 font-medium mb-2">
                        <svg class="w-5 h-5 mr-2 text-libre-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Nombre Completo
                    </label>
                    <input id="nombre" type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-libre-red focus:outline-none" required>
                </div>

                <div>
                    <label class="flex items-center text-gray-700 font-medium mb-2">
                        <svg class="w-5 h-5 mr-2 text-libre-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                        </svg>
                        Identificación
                    </label>
                    <input id="identificacion" type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-libre-red focus:outline-none" required>
                </div>

                <div>
                    <label class="flex items-center text-gray-700 font-medium mb-2">
                        <svg class="w-5 h-5 mr-2 text-libre-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                        Teléfono
                    </label>
                    <input id="telefono" type="tel" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-libre-red focus:outline-none" required>
                </div>

                <div>
                    <label class="flex items-center text-gray-700 font-medium mb-2">
                        <svg class="w-5 h-5 mr-2 text-libre-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        Correo Electrónico
                    </label>
                    <input id="correo" type="email" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-libre-red focus:outline-none" required>
                </div>

                <button id="submit-registration" class="w-full bg-libre-red hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-105">
                    Continuar
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-libre-black text-white py-8 mt-16">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2025 Universidad Libre - Programa Familibre. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="registro.js"></script>
</body>
</html>
